3.	Notepad login.html

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #b7c9e0;
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #174ea6;
        }
        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
        }
        input {
            border: 1px solid #aaa;
        }
        button {
            background: #1769e0;
            color: white;
            border: none;
            cursor: pointer;
        }
        #message {
            text-align: center;
            color: #174ea6;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>User Login</h2>
        <form id="loginForm">
            <input type="text" id="username"
                   placeholder="Enter username" required>
            <input type="password" id="password"
                   placeholder="Enter password" required>
            <button type="submit">Login</button>
        </form>
        <p id="message"></p>
    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                document.getElementById("message").textContent =
                    "Login form submitted successfully!";
            });
    </script>
</body>
</html>
